<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#030611"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#070d1e"/>
  <!-- Orbit ring -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-30 50 50)"/>
  <!-- Central Star -->
  <circle cx="50" cy="50" r="8" fill="#ffffff"/>
  <circle cx="50" cy="50" r="14" fill="url(#starGlow)" opacity="0.4"/>
  <!-- Small orbiting planet/satellite -->
  <circle cx="78" cy="34" r="3.5" fill="#38bdf8"/>
  <circle cx="22" cy="66" r="2.5" fill="#a5b4fc"/>
</svg>